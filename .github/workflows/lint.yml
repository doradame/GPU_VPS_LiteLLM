name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./scripts
          additional_files: scripts/lib/common.sh stack/backup-db.sh

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pipx install yamllint
      - name: Lint YAML templates
        # Only the YAML templates — Caddyfile.tmpl is Caddyfile syntax, not YAML.
        run: |
          cat > .yamllint <<'EOF'
          extends: default
          rules:
            line-length: disable
            document-start: disable
            truthy:
              allowed-values: ['true', 'false', 'yes', 'no']
          EOF
          yamllint stack/docker-compose.yml.tmpl stack/litellm-config.header.tmpl

  write-config-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write_config round-trip (spaces, quotes, metacharacters)
        run: bash scripts/tests/write-config-test.sh

  scripts-render-e2e:
    # Runs the REAL scripts (00-preflight + 05-stack-config) instead of
    # hand-copying templates, then validates everything they produced.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run 00-preflight.sh non-interactively
        run: |
          set -euo pipefail
          # prompt_default/prompt_yesno skip any variable that is already set,
          # so exporting everything makes the script fully non-interactive.
          export DATA_DEVICE=/dev/sdb DATA_MOUNT=/tmp/llm \
                 LUKS_NAME=llm_crypt LUKS_KEYFILE=/root/llm.key \
                 DOMAIN=llm.test.local ACME_EMAIL=a@b.c \
                 ALLOWED_IPS='1.2.3.4 5.6.7.8/32' \
                 ENABLE_OLLAMA=yes ENABLE_VLLM=yes \
                 OLLAMA_IMAGE_TAG=0.32.6 \
                 OLLAMA_MODELS_PULL='gemma4:31b=bigmodel llama3.1:8b' \
                 OLLAMA_KEEP_ALIVE=24h OLLAMA_MAX_LOADED_MODELS=2 OLLAMA_NUM_PARALLEL=1 \
                 OLLAMA_CONTEXT_LENGTH=8192 \
                 VLLM_IMAGE_TAG=v0.8.5 VLLM_MODEL=test/model VLLM_SERVED_NAME=testvllm \
                 VLLM_GPU_MEM_UTIL=0.55 VLLM_MAX_MODEL_LEN=4096 HF_TOKEN= \
                 VLLM_EXTRA_ARGS='--max-num-seqs 24 --enable-prefix-caching --guided-decoding-backend xgrammar' \
                 ENABLE_VLLM2=yes VLLM2_MODEL=test/model2 VLLM2_SERVED_NAME=testvllm2 \
                 VLLM2_GPU_MEM_UTIL=0.35 VLLM2_MAX_MODEL_LEN=4096 \
                 VLLM2_EXTRA_ARGS='--guided-decoding-backend xgrammar' \
                 NVIDIA_DRIVER_PKG=nvidia-driver-580-server \
                 LITELLM_IMAGE=ghcr.io/berriai/litellm:latest
          ./scripts/00-preflight.sh </dev/null
      - name: config.env must be sourceable under set -u (quoting regression)
        run: |
          bash -euo pipefail -c '
            set -a; . ./config.env; set +a
            [ "$ALLOWED_IPS" = "1.2.3.4 5.6.7.8/32" ]
            [ "$OLLAMA_MODELS_PULL" = "gemma4:31b=bigmodel llama3.1:8b" ]
          '
      - name: Run 03-docker.sh for real (data-root + containerd on the data volume)
        run: |
          set -euo pipefail
          mkdir -p /tmp/llm
          # 03 requires DATA_MOUNT to be a mountpoint; a bind mount will do.
          sudo mount --bind /tmp/llm /tmp/llm
          # Steps 01-02 need a GPU/disk; fake their completion markers.
          touch .state/01-nvidia-driver.done .state/02-luks-volume.done
          sudo ./scripts/03-docker.sh
      - name: Images must land on the data volume, not the OS disk
        run: |
          set -euo pipefail
          sudo docker pull postgres:16-alpine
          leaked="$(sudo du -s /var/lib/containerd 2>/dev/null | cut -f1 || echo 0)"
          if [ "${leaked:-0}" -ge 51200 ]; then
            echo "FAIL: image data leaked to /var/lib/containerd (${leaked} KB)"; exit 1
          fi
          used="$(sudo du -s /tmp/llm | cut -f1)"
          if [ "$used" -lt 100000 ]; then
            echo "FAIL: expected image data under /tmp/llm, found only ${used} KB"; exit 1
          fi
          echo "OK: ${used} KB under /tmp/llm, ${leaked:-0} KB left on the OS disk"
      - name: Run 05-stack-config.sh
        run: |
          set -euo pipefail
          touch .state/04-nvidia-toolkit.done
          # Simulate a live postgres data dir: 05 must NOT touch its ownership.
          sudo mkdir -p /tmp/llm/stack/pgdata
          sudo touch /tmp/llm/stack/pgdata/PG_VERSION
          sudo chown -R 999:999 /tmp/llm/stack/pgdata
          sudo ./scripts/05-stack-config.sh
          owner="$(stat -c '%u' /tmp/llm/stack/pgdata/PG_VERSION)"
          if [ "$owner" != "999" ]; then
            echo "FAIL: 05 changed pgdata ownership (now uid $owner) — postgres would lose its files"; exit 1
          fi
      - name: Validate rendered stack
        run: |
          set -euo pipefail
          cd /tmp/llm/stack
          sudo docker compose --env-file .env config >/dev/null
          sudo grep -q 'model: ollama_chat/gemma4:31b'   litellm-config.yaml
          sudo grep -q 'model_name: bigmodel'            litellm-config.yaml
          sudo grep -q 'model: ollama_chat/llama3.1:8b'  litellm-config.yaml
          sudo grep -q 'model_name: llama3.1-8b'         litellm-config.yaml
          sudo grep -q 'model: openai/testvllm$'    litellm-config.yaml
          sudo grep -q 'model: openai/testvllm2'    litellm-config.yaml
          # EXTRA_ARGS must reach the vllm command line intact, spaces included
          sudo docker compose --env-file .env config | grep -q -- '--max-num-seqs 24'
          sudo docker compose --env-file .env config | grep -q 'vllm2'
          sudo test -x backup-db.sh
          sudo test -f /etc/cron.d/llm-db-backup
