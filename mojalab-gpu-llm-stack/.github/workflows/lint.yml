name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./scripts
          additional_files: scripts/lib/common.sh stack/backup-db.sh

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pipx install yamllint
      - name: Lint YAML templates
        # Only the YAML templates — Caddyfile.tmpl is Caddyfile syntax, not YAML.
        run: |
          cat > .yamllint <<'EOF'
          extends: default
          rules:
            line-length: disable
            document-start: disable
            truthy:
              allowed-values: ['true', 'false', 'yes', 'no']
          EOF
          yamllint stack/docker-compose.yml.tmpl stack/litellm-config.header.tmpl

  write-config-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write_config round-trip (spaces, quotes, metacharacters)
        run: bash scripts/tests/write-config-test.sh

  scripts-render-e2e:
    # Runs the REAL scripts (00-preflight + 05-stack-config) instead of
    # hand-copying templates, then validates everything they produced.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run 00-preflight.sh non-interactively
        run: |
          set -euo pipefail
          # prompt_default/prompt_yesno skip any variable that is already set,
          # so exporting everything makes the script fully non-interactive.
          export DATA_DEVICE=/dev/sdb DATA_MOUNT=/tmp/llm \
                 LUKS_NAME=llm_crypt LUKS_KEYFILE=/root/llm.key \
                 DOMAIN=llm.test.local ACME_EMAIL=a@b.c \
                 ALLOWED_IPS='1.2.3.4 5.6.7.8/32' \
                 ENABLE_OLLAMA=yes ENABLE_VLLM=yes \
                 OLLAMA_IMAGE_TAG=0.32.6 \
                 OLLAMA_MODELS_PULL='gemma4:31b llama3.1:8b' \
                 OLLAMA_KEEP_ALIVE=24h OLLAMA_MAX_LOADED_MODELS=2 OLLAMA_NUM_PARALLEL=1 \
                 VLLM_IMAGE_TAG=v0.8.5 VLLM_MODEL=test/model VLLM_SERVED_NAME=testvllm \
                 VLLM_GPU_MEM_UTIL=0.85 VLLM_MAX_MODEL_LEN=8192 HF_TOKEN= \
                 NVIDIA_DRIVER_PKG=nvidia-driver-580-server \
                 LITELLM_IMAGE=ghcr.io/berriai/litellm:latest
          ./scripts/00-preflight.sh </dev/null
      - name: config.env must be sourceable under set -u (quoting regression)
        run: |
          bash -euo pipefail -c '
            set -a; . ./config.env; set +a
            [ "$ALLOWED_IPS" = "1.2.3.4 5.6.7.8/32" ]
            [ "$OLLAMA_MODELS_PULL" = "gemma4:31b llama3.1:8b" ]
          '
      - name: Run 05-stack-config.sh (skipping host-only prerequisites)
        run: |
          set -euo pipefail
          mkdir -p /tmp/llm
          # Steps 01-04 need a GPU/disk; fake their completion markers.
          touch .state/01-nvidia-driver.done .state/02-luks-volume.done \
                .state/03-docker.done .state/04-nvidia-toolkit.done
          sudo ./scripts/05-stack-config.sh
      - name: Validate rendered stack
        run: |
          set -euo pipefail
          cd /tmp/llm/stack
          sudo docker compose --env-file .env config >/dev/null
          sudo grep -q 'model: ollama/gemma4:31b'   litellm-config.yaml
          sudo grep -q 'model: ollama/llama3.1:8b'  litellm-config.yaml
          sudo grep -q 'model: openai/testvllm'     litellm-config.yaml
          sudo test -x backup-db.sh
          sudo test -f /etc/cron.d/llm-db-backup
